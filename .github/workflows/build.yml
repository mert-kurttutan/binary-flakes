name: Build published packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  watch-releases:
    uses: ./.github/workflows/watch-releases.yml
    secrets: inherit

  build:
    needs: watch-releases
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Check and build
        run: |
          set -euo pipefail
          nix flake check
          nix build .#obsidian .#zed .#proton-pass-cli --no-link
          if [ "$RUNNER_ARCH" = X64 ]; then
            nix build .#codex .#proton-pass --no-link
          fi
      - name: Smoke test Codex launchers
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          set -euo pipefail
          native="$(nix build .#codex --no-link --print-out-paths)"
          "$native/bin/codex" --version
