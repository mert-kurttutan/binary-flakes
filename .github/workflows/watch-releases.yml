name: Watch and release binary assets

on:
  schedule:
    - cron: "17 * * * *"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [codex, obsidian, zed, proton-pass-cli]
    concurrency:
      group: release-${{ matrix.package }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Install Nushell
        run: nix profile install nixpkgs#nushell
      - name: Check upstream release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          check_output="$(nu scripts/check-updates.nu --package "$PACKAGE")"
          printf '%s\n' "$check_output" | tee -a "$GITHUB_OUTPUT"
          version="$(printf '%s\n' "$check_output" | awk -F= '$1 == "new_version" { print $2 }')"
          if gh release view "$PACKAGE-v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release_missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "release_missing=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download and compress release assets
        if: steps.check.outcome == 'success' && (steps.check.outputs.update_needed == 'true' || steps.check.outputs.release_missing == 'true')
        env:
          PACKAGE: ${{ matrix.package }}
          VERSION: ${{ steps.check.outputs.new_version }}
        run: |
          set -euo pipefail
          nu scripts/repack-release.nu "$PACKAGE" --version "$VERSION"
          nu scripts/update.nu --package "$PACKAGE" --version "$VERSION"
          nix-instantiate --parse packages/codex/package.nix >/dev/null
          nix-instantiate --parse packages/obsidian/package.nix >/dev/null
          nix-instantiate --parse packages/zed/package.nix >/dev/null
          nix-instantiate --parse packages/proton-pass-cli/package.nix >/dev/null
      - name: Publish compressed assets
        if: steps.check.outcome == 'success' && (steps.check.outputs.update_needed == 'true' || steps.check.outputs.release_missing == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ matrix.package }}
          VERSION: ${{ steps.check.outputs.new_version }}
        run: |
          set -euo pipefail
          tag="$PACKAGE-v$VERSION"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --notes "zstd-compressed $PACKAGE $VERSION binaries"
          fi
          if [ "$PACKAGE" = codex ]; then
            gh release upload "$tag" \
              .release-assets/codex-x86_64-unknown-linux-musl.zst \
              .release-assets/codex-code-mode-host-x86_64-unknown-linux-musl.zst \
              --repo "$GITHUB_REPOSITORY"
          elif [ "$PACKAGE" = obsidian ]; then
            gh release upload "$tag" \
              .release-assets/obsidian-linux-x86_64.tar.zst \
              .release-assets/obsidian-linux-aarch64.tar.zst \
              --repo "$GITHUB_REPOSITORY"
          elif [ "$PACKAGE" = zed ]; then
            gh release upload "$tag" \
              .release-assets/zed-linux-x86_64.tar.zst \
              .release-assets/zed-linux-aarch64.tar.zst \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release upload "$tag" \
              .release-assets/pass-cli-linux-x86_64.zst \
              .release-assets/pass-cli-linux-aarch64.zst \
              --repo "$GITHUB_REPOSITORY"
          fi
      - name: Verify Linux package
        if: steps.check.outcome == 'success' && (steps.check.outputs.update_needed == 'true' || steps.check.outputs.release_missing == 'true')
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          nix flake check
          if [ "$PACKAGE" = codex ]; then
            nix build .#codex --no-link
          elif [ "$PACKAGE" = obsidian ]; then
            nix build .#obsidian --no-link
          elif [ "$PACKAGE" = zed ]; then
            nix build .#zed --no-link
          else
            nix build .#proton-pass-cli --no-link
          fi
      - name: Open package update PR
        if: steps.check.outcome == 'success' && (steps.check.outputs.update_needed == 'true' || steps.check.outputs.release_missing == 'true')
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: update-${{ matrix.package }}-${{ steps.check.outputs.new_version }}
          delete-branch: true
          commit-message: "chore: update ${{ matrix.package }} to ${{ steps.check.outputs.new_version }}"
          title: "Update ${{ matrix.package }} to ${{ steps.check.outputs.new_version }}"
          body: |
            Updates the package to use the zstd-compressed assets published in this repository's ${{ matrix.package }}-v${{ steps.check.outputs.new_version }} release.

            Linux x86_64 builds and flake checks passed in the release workflow.
